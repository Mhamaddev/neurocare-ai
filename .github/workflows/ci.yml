name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      - name: Tests that load the trained model
        working-directory: backend
        env:
          RUN_MODEL_TESTS: "1"
          MODEL_DIR: artifacts/20261029T043159Z-bd9e866c
        run: python -m pytest -q tests/test_model_artifact.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
